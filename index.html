<!doctype html>
<html lang="en" data-theme="academic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrestPrep | Free Digital SAT Ultimate Course</title>
  <meta name="description" content="A 100% free Digital SAT course built on your own Bluebook practice tests: score report upload, error logs, an AI tutor, note guides, adaptive practice, and a day-by-day study plan. Built by Saransh Shekhar for the Congressional App Challenge (TX-26).">
  <link rel="icon" href="assets/crest.svg" type="image/svg+xml">

  <!-- Apply the saved theme before anything paints, so there is no flash of the wrong colors -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('crestprep:v2'));
      if (saved && saved.prefs) document.documentElement.dataset.theme = saved.prefs.theme;
    } catch (e) {}
  </script>

  <!-- Fonts: Merriweather (headings + note guides), Inter (interface), Space Mono (scores) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Space+Mono:wght@400;700&display=swap">

  <!-- KaTeX typesets the math in questions, e.g. \( x^2 - 6x + 5 \) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header id="topbar"></header>
  <div id="view" tabindex="-1"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- The whole app starts here. main.js imports every other module. -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
